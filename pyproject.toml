[project]
name = "tells"
version = "0.0.1"
description = "A deterministic record of your machine, for you and any agent you let read it."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.scripts]
tells = "tells.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tells"]

[dependency-groups]
dev = ["pytest"]
